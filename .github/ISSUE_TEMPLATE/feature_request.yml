name: Feature request
description: Suggest an improvement or a new tool
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Flags, behaviour, or the new tool's purpose.
